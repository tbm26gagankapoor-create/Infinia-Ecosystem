site_name: AI Gateway
site_description: "Every open-source model. One platform. Total control."
site_url: https://aigateway.infiniatechnologies.com

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Space Grotesk
    code: Roboto Mono
  icon:
    logo: material/transit-connection-variant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - content.tabs.link
    - content.tooltips

nav:
  - Home: index.md
  - Market Opportunity: market-opportunity.md
  - Competitive Landscape: competitive-landscape.md
  - Differentiation: differentiation.md
  - Product Strategy: product-strategy.md
  - Pricing: pricing.md
  - Go-to-Market: go-to-market.md
  - Financials: financials.md
  - Team & Backing: team-backing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/infiniatechnologies
    - icon: fontawesome/solid/globe
      link: https://infiniatechnologies.com
