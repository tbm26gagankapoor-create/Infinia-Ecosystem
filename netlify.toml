[build]
  command = """
cd user-portal && npm install && npm run build && rm -rf ../user-portal-app && cp -r dist ../user-portal-app && \
cd ../admin-portal && npm install && npm run build && rm -rf ../admin-portal-app && cp -r dist ../admin-portal-app
"""
  publish = "."

# ── User Portal redirects ──
[[redirects]]
  from = "/user-portal"
  to = "/user-portal-app/"
  status = 301
  force = true

[[redirects]]
  from = "/user-portal/*"
  to = "/user-portal-app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/user-portal-app/*"
  to = "/user-portal-app/index.html"
  status = 200

# ── Admin Portal redirects ──
[[redirects]]
  from = "/admin-portal"
  to = "/admin-portal-app/"
  status = 301
  force = true

[[redirects]]
  from = "/admin-portal/*"
  to = "/admin-portal-app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin-portal-app/*"
  to = "/admin-portal-app/index.html"
  status = 200
